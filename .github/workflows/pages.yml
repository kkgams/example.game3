name: Build and deploy web game

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish; newer queued pushes replace older queued runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web game and run tests
        run: make test
      - name: Upload static game
        if: github.ref == 'refs/heads/release'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build.nosync/web

  deploy:
    if: github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
