<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>example.game3 — Survivor combat</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    header { display: flex; gap: 12px; align-items: center; padding: 8px; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <button id="pause" disabled>Pause</button>
    <button id="reload" disabled>Reload</button>
    <span id="status" role="status">Loading…</span>
  </header>
  <canvas id="canvas" tabindex="0" aria-label="Survivor arena: WASD or arrows to move, attacks fire automatically, collect purple XP gems, choose upgrades with 1 2 3, survive 90 seconds then defeat the boss, R to restart after win or loss"></canvas>
  <script type="module" src="./runner.js"></script>
</body>
</html>
